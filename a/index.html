<script defer="">
(function() {
  var STORAGE_KEY = 'snakeHighScore';
  function getStored() {
    try {
      var n = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      return isNaN(n) ? 0 : n;
    } catch (e) { return 0; }
  }
  function setStored(num) {
    try {
      localStorage.setItem(STORAGE_KEY, String(num));
    } catch (e) {}
  }
  function applyStored() {
    var high = getStored();
    if (high === 0) return;
    var elHeader = document.querySelector('[jsname="E5ziSe"]');
    var elModal = document.querySelector('[jsname="Vp6PHf"]');
    if (elHeader) elHeader.textContent = high;
    if (elModal) elModal.textContent = high;
  }
  function observeScore(el, isHeader) {
    if (!el) return;
    var obs = new MutationObserver(function() {
      var n = parseInt(el.textContent, 10);
      if (isNaN(n)) return;
      var stored = getStored();
      if (n > stored) setStored(n);
      else if (stored > 0 && (n === 0 || n < stored)) el.textContent = stored;
    });
    obs.observe(el, { childList: true, characterData: true, subtree: true });
  }
  function run() {
    var header = document.querySelector('[jsname="E5ziSe"]');
    var modal = document.querySelector('[jsname="Vp6PHf"]');
    applyStored();
    [100, 500, 1200].forEach(function(ms) {
      setTimeout(applyStored, ms);
    });
    observeScore(header, true);
    observeScore(modal, false);
    var overlay = document.querySelector('[jsname="XRjYde"]');
    if (overlay && modal) {
      var obsOverlay = new MutationObserver(function() {
        var high = getStored();
        if (high > 0) modal.textContent = high;
      });
      obsOverlay.observe(overlay, { attributes: true, attributeFilter: ['style', 'class'] });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(run, 50); });
  } else {
    setTimeout(run, 50);
  }
})();
</script>
